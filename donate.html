<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n="donatePageTitle">Ủng hộ tác giả</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            max-width: 340px;
            margin: 0 auto;
            padding: 32px 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
            background: #1e1e2e;
            color: #cdd6f4;
        }

        h1 {
            font-size: 20px;
            color: #89b4fa;
            margin: 0 0 8px;
        }

        img {
            display: block;
            width: 100%;
            margin: 16px 0;
            border-radius: 8px;
            background: #ffffff;
        }

        .muted {
            color: #a6adc8;
            font-size: 12.5px;
        }
    </style>
</head>

<body>
    <h1 data-i18n="donateHeading">☕ Ủng hộ tác giả</h1>
    <p data-i18n="donateIntro">Tiện ích này miễn phí. Nếu thấy hữu ích, bạn có thể ủng hộ tùy tâm bằng cách quét mã trong ứng dụng MoMo.</p>
    <img id="momoQr" src="momo-qr.png" data-i18n-alt="donateAlt" alt="Mã QR MoMo để ủng hộ tác giả">
    <p class="muted" data-i18n="donateNote">Ủng hộ là tự nguyện và không mở thêm tính năng. Giao dịch diễn ra trong MoMo giữa bạn và tác giả, không qua Google, và tiện ích không nhận được thông tin thanh toán của bạn.</p>
    <script src="i18n.js"></script>
    <script src="i18n-page.js"></script>
</body>

</html>
