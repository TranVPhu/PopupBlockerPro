<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 280px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 14px;
            margin: 0;
            background: #1e1e2e;
            color: #cdd6f4;
            text-align: center;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .header img {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            box-shadow: 0 0 10px rgba(137, 180, 250, 0.4);
        }

        h3 {
            margin: 0;
            font-size: 14px;
            color: #89b4fa;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #313244;
            padding: 9px 4px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-num {
            font-size: 20px;
            font-weight: 800;
            color: #a6e3a1;
            display: block;
        }

        .stat-lbl {
            font-size: 11px;
            color: #a6adc8;
            margin-top: 3px;
            display: block;
        }

        .domain-box {
            background: #181825;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #f9e2af;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 6px;
            font-size: 11.5px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-tool {
            background: #45475a;
            color: #cdd6f4;
            margin-bottom: 0;
            font-size: 11px;
            padding: 7px 4px;
        }

        .btn-on {
            background: #a6e3a1;
            color: #11111b;
            font-weight: 700;
            padding: 10px;
        }

        .btn-off {
            background: #f38ba8;
            color: #11111b;
            font-weight: 700;
            padding: 10px;
        }

        .btn-wl-add {
            background: #89b4fa;
            color: #11111b;
        }

        .btn-wl-remove {
            background: #fab387;
            color: #11111b;
        }

        .btn-reset {
            background: #313244;
            color: #f38ba8;
            font-size: 11px;
            border: 1px dashed rgba(243, 139, 168, 0.4);
            display: none;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon48.png" alt="Popup Blocker Pro Logo">
        <h3>Popup Blocker Pro</h3>
    </div>
    <div class="stat-grid">
        <div class="stat-card">
            <span class="stat-num" id="tabCount">0</span>
            <span class="stat-lbl">🛡️ Trang này</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" id="count">0</span>
            <span class="stat-lbl">🌐 Toàn hệ thống</span>
        </div>
    </div>
    <div class="domain-box" id="currentDomain">Đang kiểm tra tên miền...</div>

    <!-- Hàng công cụ hỗ trợ lọc DOM giống uBlock Origin -->
    <div class="tools-grid">
        <button id="pickerBtn" class="btn-tool" title="Chọn phần tử bằng chuột để ẩn vĩnh viễn">🎯 Rà chọn ẩn</button>
        <button id="zapperBtn" class="btn-tool" title="Click xóa nhanh phần tử ngay lập tức (không lưu)">⚡ Tẩy nhanh</button>
    </div>

    <button id="resetBtn" class="btn-reset">♻️ Khôi phục phần tử đã ẩn</button>
    <button id="whitelistBtn" class="btn-wl-add">Cho phép trang này (Whitelist)</button>
    <button id="toggleBtn" class="btn-on">ĐANG BẬT TOÀN HỆ THỐNG</button>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>

</html>
