<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 280px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 14px;
            margin: 0;
            background: #1e1e2e;
            color: #cdd6f4;
            text-align: center;
            user-select: none;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .header img {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            box-shadow: 0 0 10px rgba(137, 180, 250, 0.4);
        }

        h3 {
            margin: 0;
            font-size: 14px;
            color: #89b4fa;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .stat-card {
            background: #313244;
            padding: 9px 4px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-num {
            font-size: 20px;
            font-weight: 800;
            color: #a6e3a1;
            display: block;
        }

        .stat-lbl {
            font-size: 11px;
            color: #a6adc8;
            margin-top: 3px;
            display: block;
        }

        .domain-box {
            background: #181825;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #f9e2af;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 6px;
            font-size: 11.5px;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-tool {
            background: #45475a;
            color: #cdd6f4;
            margin-bottom: 0;
            font-size: 11px;
            padding: 7px 4px;
        }

        .btn-tool-wide {
            grid-column: 1 / -1;
        }

        .btn-on {
            background: #a6e3a1;
            color: #11111b;
            font-weight: 700;
            padding: 10px;
        }

        .btn-off {
            background: #f38ba8;
            color: #11111b;
            font-weight: 700;
            padding: 10px;
        }

        .btn-wl-add {
            background: #89b4fa;
            color: #11111b;
        }

        .btn-wl-remove {
            background: #fab387;
            color: #11111b;
        }

        .btn-pause {
            background: #f9e2af;
            color: #11111b;
        }

        .btn-resume {
            background: #a6e3a1;
            color: #11111b;
        }

        .btn-reset {
            background: #313244;
            color: #f38ba8;
            font-size: 11px;
            border: 1px dashed rgba(243, 139, 168, 0.4);
            display: none;
        }

        .footer {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 4px;
            font-size: 11px;
        }

        .footer a {
            color: #a6adc8;
            text-decoration: none;
        }

        .footer a:hover {
            color: #cdd6f4;
            text-decoration: underline;
        }

        .footer a[hidden] {
            display: none;
        }

        .language-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 11px;
            color: #a6adc8;
        }

        .language-row select {
            padding: 2px 4px;
            font-size: 11px;
            color: #cdd6f4;
            background: #313244;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="icons/icon48.png" data-i18n-alt="logoAlt" alt="Logo Popup &amp; Overlay Blocker">
        <h3>Popup &amp; Overlay Blocker</h3>
    </div>
    <div class="stat-grid">
        <div class="stat-card">
            <span class="stat-num" id="tabCount">0</span>
            <span class="stat-lbl" data-i18n="statThisPage">🛡️ Trang này</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" id="count">0</span>
            <span class="stat-lbl" data-i18n="statAllSites">🌐 Toàn hệ thống</span>
        </div>
    </div>
    <div class="domain-box" id="currentDomain" data-i18n="domainChecking">Đang kiểm tra tên miền...</div>

    <!-- Hàng công cụ hỗ trợ lọc DOM giống uBlock Origin -->
    <div class="tools-grid">
        <button id="pickerBtn" class="btn-tool" data-i18n="pickerBtn" data-i18n-title="pickerTitle" title="Chọn phần tử bằng chuột để ẩn vĩnh viễn">🎯 Rà chọn ẩn</button>
        <button id="zapperBtn" class="btn-tool" data-i18n="zapperBtn" data-i18n-title="zapperTitle" title="Click ẩn nhanh phần tử ngay lập tức (không lưu)">⚡ Tẩy nhanh</button>
        <button id="qrBtn" class="btn-tool btn-tool-wide" data-i18n="qrBtn" data-i18n-title="qrBtnTitle" title="Tạo mã QR cho đường link của trang này">📱 Tạo mã QR cho trang này</button>
    </div>

    <button id="pauseBtn" class="btn-pause"></button>
    <button id="resetBtn" class="btn-reset" data-i18n="restoreDefault">♻️ Khôi phục phần tử đã ẩn</button>
    <button id="whitelistBtn" class="btn-wl-add" data-i18n="whitelistAdd">Cho phép trang này (Whitelist)</button>
    <button id="toggleBtn" class="btn-on" data-i18n="toggleOn">ĐANG BẬT TOÀN HỆ THỐNG</button>

    <div class="footer">
        <a id="donateLink" href="donate.html" target="_blank" data-i18n="donateLink" hidden>☕ Ủng hộ tác giả</a>
        <a id="privacyLink" href="privacy.html" target="_blank" data-i18n="privacyLink">Quyền riêng tư &amp; giấy phép</a>
    </div>

    <label class="language-row">
        <span data-i18n="languageLabel">🌐 Ngôn ngữ</span>
        <select id="languageSelect">
            <option value="vi" lang="vi">Tiếng Việt</option>
            <option value="en" lang="en">English</option>
        </select>
    </label>

    <script src="shared.js"></script>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
</body>

</html>
