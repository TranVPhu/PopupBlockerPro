name: Cập nhật bộ lọc

on:
  schedule:
    - cron: "17 2 * * 1" # 9h17 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Biên dịch bộ lọc mới
        run: python build_easylist.py --strict
      - name: Kiểm tra có thay đổi không
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test trình biên dịch bộ lọc
        if: steps.diff.outputs.changed == 'true'
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Cài Playwright
        if: steps.diff.outputs.changed == 'true'
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test end-to-end với bộ lọc mới
        if: steps.diff.outputs.changed == 'true'
        working-directory: tests
        run: npm test
      # Người dùng store chỉ nhận bộ lọc mới khi có phiên bản mới, và store chỉ nhận số phiên bản lớn hơn bản đã nộp
      - name: Tăng số phiên bản và đóng gói
        if: steps.diff.outputs.changed == 'true'
        id: release
        run: |
          python bump_version.py
          python package_extension.py
          echo "version=$(python -c "import json; print(json.load(open('manifest.json', encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Commit bộ lọc mới
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules.json popup_domains.json cosmetic_rules.js manifest.json
          git commit -m "chore: cập nhật bộ lọc tự động (phiên bản ${{ steps.release.outputs.version }})"
          git push
      # Chỉ tải lên sau khi đã commit thành công, để gói trong Artifacts luôn khớp với phiên bản trong repo
      - name: Lưu gói để nộp lên store
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: PopupBlockerPro-${{ steps.release.outputs.version }}
          path: dist/PopupBlockerPro_v${{ steps.release.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 90
