name: Cập nhật bộ lọc

on:
  schedule:
    - cron: "17 2 * * 1" # 9h17 sáng thứ Hai giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Biên dịch bộ lọc mới
        run: python build_easylist.py --strict
      - name: Kiểm tra có thay đổi không
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test trình biên dịch bộ lọc
        if: steps.diff.outputs.changed == 'true'
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Cài Playwright
        if: steps.diff.outputs.changed == 'true'
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test end-to-end với bộ lọc mới
        if: steps.diff.outputs.changed == 'true'
        working-directory: tests
        run: npm test
      - name: Commit bộ lọc mới
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules.json popup_domains.json cosmetic_rules.js
          git commit -m "chore: cập nhật bộ lọc tự động"
          git push
